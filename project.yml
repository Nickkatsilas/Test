name: HealthExport
options:
  bundleIdPrefix: com.lapota
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Fill in your 10-character Apple Developer Team ID (or set it in Xcode > Signing & Capabilities).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  HealthExport:
    type: application
    platform: iOS
    sources:
      - path: HealthExport
        excludes:
          - Info.plist
          - "*.entitlements"
    settings:
      base:
        # Change this if the ID is taken in your developer account.
        PRODUCT_BUNDLE_IDENTIFIER: com.lapota.healthexport
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: HealthExport/Info.plist
      properties:
        CFBundleDisplayName: Health Export
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [healthkit]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.lapota.healthexport.refresh]
        NSHealthShareUsageDescription: Health Export reads your Health data to build a daily CSV and send it to your own dashboard.
    entitlements:
      path: HealthExport/HealthExport.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
